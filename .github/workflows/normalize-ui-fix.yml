name: Normalize UI fix
on:
  push:
    paths:
      - '.github/workflows/normalize-ui-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize stylesheet newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('templates/partida.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\n', '\n')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/partida.html
          git commit -m 'Corrige CSS dos ajustes da partida' || true
          git push
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/normalize-ui-fix.yml
          git commit -m 'Remove workflow temporário' || true
          git push
