<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 a 7 — Multiplayer</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="game-page"><main class="game-shell"><p class="eyebrow">MULTIPLAYER</p><h1>Jogue com amigos.</h1><section class="setup-card"><h2>Criar sala</h2><form method="post"><input type="hidden" name="action" value="create"><div class="choice-grid two"><label class="choice"><input type="radio" name="mode" value="final" checked><span>Final de Copa</span></label><label class="choice"><input type="radio" name="mode" value="copa"><span>Mata-mata</span></label></div><button class="primary-button" type="submit">CRIAR SALA →</button></form></section><section class="setup-card"><h2>Entrar com código</h2><form method="post" class="inline-form"><input type="hidden" name="action" value="join"><input name="code" placeholder="ABC123" maxlength="6" required><button class="secondary-button">ENTRAR</button></form></section><section class="setup-card"><h2>Salas abertas</h2>{% for room in rooms %}<p><a href="{{url_for('room',code=room.code)}}">{{room.code}} · {{room.mode}}</a></p>{% else %}<p>Nenhuma sala aberta.</p>{% endfor %}</section><a href="{{url_for('dashboard')}}">← Central</a></main></body></html>
