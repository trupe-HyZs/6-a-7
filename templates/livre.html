<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 a 7 — Modo Livre</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="game-page"><main class="game-shell"><p class="eyebrow">COPA DOS SONHOS</p><h1>Monte seu baralho</h1><p class="subtitle">Escolha as seleções e Copas que quiser. Com 11 cartas você pode iniciar.</p><div class="choice-grid">{% for item in items %}<form method="post"><input type="hidden" name="item" value="{{item}}"><button class="choice {% if item in selected %}selected{% endif %}" type="submit">{{item}}</button></form>{% endfor %}</div><p>{{selected|length}} cartas selecionadas {% if ready %}— pronto para jogar{% endif %}</p>{% if selected %}<form method="post"><input type="hidden" name="clear" value="1"><button class="secondary-button">LIMPAR</button></form>{% endif %}<a class="primary-button" href="{{url_for('desafio')}}">JOGAR COM ESTE BARALHO</a></main></body></html>
