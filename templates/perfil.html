<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 a 7 — Perfil</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="game-page"><header class="topbar"><a href="{{url_for('dashboard')}}"><div class="brand-mark small">6 <span>a</span> 7</div></a><a href="{{url_for('logout')}}">SAIR</a></header><main class="game-shell"><p class="eyebrow">FICHA DO JOGADOR</p><h1>{{session.username}}</h1><form class="inline-form" method="post"><input name="username" value="{{session.username}}" minlength="3" maxlength="24"><button class="secondary-button">SALVAR @</button></form><section class="stats-grid"><div><strong>{{stats.games}}</strong><span>jogos</span></div><div><strong>{{stats.wins}}</strong><span>vitórias</span></div><div><strong>{{stats.titles}}</strong><span>títulos</span></div><div><strong>{{stats.goals}}</strong><span>gols</span></div></section><section class="setup-card"><h2>Conquistas</h2><div class="achievement-grid">{% for code,name,desc in all_ach %}<article class="achievement {% if achievements|selectattr('code','equalto',code)|list %}unlocked{% endif %}"><strong>{{name}}</strong><span>{{desc}}</span></article>{% endfor %}</div></section></main></body></html>
