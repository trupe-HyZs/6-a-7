<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6 a 7 — Resultado</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><style>.result{max-width:760px;margin:60px auto;text-align:center}.result-card{background:#fffdf5;border:1px solid #d8d0bf;padding:42px 24px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.score{display:flex;justify-content:center;align-items:center;gap:28px;margin:25px 0}.score strong{font-size:72px;line-height:1}.score span{font-size:28px;color:#777}.eyebrow{font-size:9px;letter-spacing:2px;font-weight:900;color:#777}.result-actions{display:grid;gap:8px;max-width:360px;margin:28px auto 0}.result-actions a{display:block;padding:13px;text-decoration:none;font-weight:900;border:1px solid #222;color:#111;background:#f7f2e7}.result-actions .primary{background:#c33;border-color:#c33;color:#fff}</style></head>
<body class="game-page"><main class="game-shell result"><div class="result-card"><p class="eyebrow">RESULTADO DA CAMPANHA</p><h1>{{'CAMPEÃO!' if r.champion else 'FIM DE JOGO'}}</h1><div class="score"><strong>{{r.gf}}</strong><span>×</span><strong>{{r.ga}}</strong></div><p>{{'Você levantou a taça.' if r.champion else 'A campanha terminou. Monte outro time e tente novamente.'}}</p><div class="result-actions"><a class="primary" href="{{url_for('dashboard')}}">VOLTAR À CENTRAL</a><a href="{{url_for('desafio')}}">JOGAR DE NOVO</a></div></div></main></body></html>
